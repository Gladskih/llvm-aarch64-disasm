name: Publish package
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream:
        description: Promote a verified automatic upstream candidate
        type: boolean
        default: false

env:
  UPSTREAM_UPDATE: ${{ inputs.upstream || false }}

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/wasm.yml
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: llvm-aarch64-package-${{ github.sha }}
      - name: Verify release tag and tested artifact
        run: |
          if [ "$UPSTREAM_UPDATE" != true ]; then
            test "$GITHUB_REF_TYPE" = tag
            test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          fi
          sha256sum --check package.sha256
          node scripts/test-tarball.mjs
      - name: Promote verified upstream candidate
        if: github.event_name == 'workflow_dispatch' && inputs.upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/promote-upstream.mjs
      - name: Check immutable npm release
        id: registry
        run: node scripts/check-release.mjs
      - name: Publish tested tarball using npm Trusted Publishing
        if: steps.registry.outputs.exists == 'false'
        run: npm publish "$(node -p 'require("./pack-result.json")[0].filename')" --ignore-scripts --access public --provenance
      - name: Create or verify immutable GitHub release
        run: node scripts/publish-release.mjs artifacts/build-info.json
        env:
          GH_TOKEN: ${{ github.token }}
