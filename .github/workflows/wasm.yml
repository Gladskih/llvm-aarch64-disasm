name: Rebuild LLVM WASM
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      cold:
        description: Ignore existing build caches for a full clean rebuild
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JOBS: '4'
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential python3 curl
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ !inputs.cold }}
        with:
          path: .build/sources
          key: llvm-source-v1-${{ runner.os }}-${{ hashFiles('upstream.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ !inputs.cold }}
        with:
          path: .build/emsdk
          key: emsdk-v1-${{ runner.os }}-${{ hashFiles('upstream.json') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: ${{ !inputs.cold }}
        with:
          path: .build/state
          key: llvm-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.json', 'scripts/build-wasm.sh', 'native/CMakeLists.txt', 'scripts/prepare-mc.mjs') }}
      - run: npm ci
      - name: Build pinned runtime, metadata and package
        run: npm run build:wasm
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run verify:package
      - run: npm pack --dry-run
      - name: Pack and inspect exact release tarball
        run: |
          npm pack --ignore-scripts --json > pack-result.json
          node scripts/inspect-tarball.mjs
          node scripts/test-tarball.mjs
          sha256sum "$(node -p 'JSON.parse(require("fs").readFileSync("pack-result.json", "utf8"))[0].filename')" > package.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llvm-aarch64-package-${{ github.sha }}
          if-no-files-found: error
          path: |
            *.tgz
            package.sha256
            pack-result.json
            artifacts/build-info.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: llvm-aarch64-footprint-${{ github.sha }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .build/state/*/bridge/llvm-aarch64.map
            .build/state/*/bridge/archive-inputs.tsv

  consumers:
    needs: wasm
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node: ["20", "22", "24", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: llvm-aarch64-package-${{ github.sha }}
      - run: node scripts/test-tarball.mjs
